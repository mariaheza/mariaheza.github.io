<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="title desc">
  <title id="title">Connecting treatment histories, pharmacology and AI</title>
  <desc id="desc">A conceptual illustration of treatment timelines connected to a network of pharmacological knowledge and a model of treatment. It does not show measured data.</desc>
