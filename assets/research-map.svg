    <path d="M47 242H63M75 242H118M130 242H144" stroke="#e6bc9c"/>
  </g>
  <g fill="#b4cf9f" stroke="#214b3b" stroke-width="5"><circle cx="285" cy="181" r="11"/><circle cx="233" cy="237" r="11"/><circle cx="270" cy="299" r="11"/></g>
  <g fill="#d9c8eb" stroke="#214b3b" stroke-width="5"><circle cx="341" cy="209" r="11"/><circle cx="332" cy="275" r="11"/></g>
